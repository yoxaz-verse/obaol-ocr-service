name: Docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native image
        run: docker build --build-arg VCS_REF=${GITHUB_SHA} -t obaol-ocr-service:test .
      - name: Verify non-root and read-only runtime
        run: |
          test "$(docker run --rm --entrypoint id obaol-ocr-service:test -u)" = "10001"
          docker network create ocr-test
          docker run -d --name ocr-redis --network ocr-test redis:7.4-alpine
          docker run -d --name ocr-api --network ocr-test --read-only --tmpfs /tmp:size=512m \
            -p 8000:8000 -e API_KEY=ci-api-key-at-least-twenty-four-characters \
            -e REDIS_URL=redis://ocr-redis:6379/0 obaol-ocr-service:test
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health/ready && break; sleep 2; done
          curl -fsS -H 'X-API-Key: ci-api-key-at-least-twenty-four-characters' \
            http://localhost:8000/v1/capabilities
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yoxaz-verse/obaol-ocr-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
      - name: Scan image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ghcr.io/yoxaz-verse/obaol-ocr-service:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
