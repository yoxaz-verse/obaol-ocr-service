[project]
name = "obaol-ocr-service"
version = "1.0.0"
description = "Stateless and queued OCR API for OBAOL"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "gunicorn==23.0.0",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.32",
  "pydantic-settings==2.7.1",
  "pillow==13.0.0",
  "pytesseract==0.3.13",
  "pdf2image==1.17.0",
  "pypdf==6.21.2",
  "numpy==2.2.1",
  "redis==8.1.0",
  "rq==2.12.0",
  "prometheus-client==0.22.1",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
  "bandit==1.8.0",
  "httpx==0.28.1",
  "fakeredis==2.32.1",
  "mypy==1.14.1",
  "pip-audit==2.7.3",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.8.6",
  "types-redis==4.6.0.20241004",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"app/config.py" = ["S108"]
"app/main.py" = ["B008"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pytesseract", "pytesseract.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
